<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>项目架构介绍 · 迎宾机器人 / 加工监控与反控</title>
<style>
  :root { --bg: #101819; --surface: #172124; --line: #344346; --text: #e9f0ed; --muted: #a8b6b4; --accent: #80d5b6; --welcome: #80d5b6; --machining: #f1b67a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif; }
  button, select { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .35; }
  #app { display: flex; flex-direction: column; height: 100dvh; min-height: 560px; }
  header { flex: none; padding: 18px 28px 0; border-bottom: 1px solid var(--line); }
  .topline { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .brand { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  #title { font-size: 20px; font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #counter { margin-left: auto; flex: none; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #projects { display: flex; gap: 4px; margin-top: 14px; }
  #projects button { border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); padding: 9px 13px 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  #projects button:hover, #projects button:focus-visible { color: var(--text); }
  #projects button[aria-current="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  #stage-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px 28px; overflow: auto; }
  #stage { position: relative; width: min(100%, calc((100dvh - 300px) * 2)); flex: none; aspect-ratio: 2 / 1; }
  svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .3s ease; pointer-events: none; }
  svg.scene.active { opacity: 1; pointer-events: auto; }
  footer { flex: none; padding: 13px 28px 20px; border-top: 1px solid var(--line); background: var(--bg); }
  #caption { max-width: 1200px; min-height: 56px; color: #f3f7f5; font-size: 18px; line-height: 1.5; }
  #controls { display: flex; align-items: center; gap: 9px; margin-top: 10px; }
  .icon-btn { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 5px; color: var(--text); background: var(--surface); font-size: 19px; line-height: 1; }
  .icon-btn:hover:not(:disabled), .icon-btn:focus-visible { border-color: var(--accent); color: var(--accent); }
  #play[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  #scene-select { min-width: 130px; max-width: 250px; height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--text); }
  #step-dots { display: flex; align-items: center; gap: 6px; margin-left: 8px; }
  #step-dots button { width: 27px; height: 7px; padding: 0; border: 0; border-radius: 4px; background: #344346; }
  #step-dots button[aria-current="step"] { background: var(--accent); }
  #step-dots button:hover { background: #d9e4df; }
  #timeline { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; margin-top: 15px; }
  #timeline button { flex: 1 0 35px; min-width: 35px; height: 5px; padding: 0; border: 0; border-radius: 3px; background: #344346; }
  #timeline button[data-project="welcome"] { background: #315448; }
  #timeline button[data-project="machining"] { background: #624632; }
  #timeline button[aria-current="page"] { background: var(--accent); }
  svg text { font-family: inherit; }
  .step { opacity: 0; transition: opacity .45s ease, transform .45s ease; }
  g.step:not(.packet) { transform: translateY(6px); }
  .step.on { opacity: 1; transform: none; }
  .box rect { transition: stroke-width .3s, filter .3s; }
  .box.hot rect { stroke-width: 2.8; filter: drop-shadow(0 0 10px currentColor); }
  .link path.flow { stroke-dasharray: 7 6; }
  .link.hot path.flow { animation: dash .9s linear infinite; filter: drop-shadow(0 0 5px currentColor); stroke-width: 2.4; }
  .link path.session { stroke-dasharray: 2 5; stroke-linecap: round; }
  .link.hot path.session { animation: dash .9s linear infinite; filter: drop-shadow(0 0 5px currentColor); }
  .link.hot path.plain { filter: drop-shadow(0 0 5px currentColor); stroke-width: 2.4; }
  .packet circle { filter: drop-shadow(0 0 6px currentColor); }
  @keyframes dash { to { stroke-dashoffset: -26; } }
  @media (prefers-reduced-motion: reduce) { .link.hot path { animation: none !important; } svg.scene, .step { transition: none; } }
  @media (max-width: 900px) {
    header { padding: 10px 15px 0; }
    #title { font-size: 16px; }
    .brand { display: none; }
    #projects { margin-top: 8px; overflow-x: auto; }
    #projects button { font-size: 12px; }
    #stage-wrap { justify-content: flex-start; padding: 8px 12px; }
    #stage { width: min(830px, calc((100dvh - 300px) * 2)); min-width: 600px; }
    footer { padding: 11px 15px 13px; }
    #caption { min-height: 68px; font-size: 14px; }
    #controls { gap: 6px; }
    #step-dots { margin-left: auto; }
    #scene-select { min-width: 0; max-width: 170px; }
    #timeline button { flex-basis: 0; min-width: 20px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="topline"><span class="brand">项目架构介绍</span><span id="title"></span><span id="counter"></span></div>
    <nav id="projects" aria-label="项目导航">
      <button type="button" data-project="overview">总览</button>
      <button type="button" data-project="welcome">Welcome 迎宾机器人</button>
      <button type="button" data-project="machining">加工监控与反控</button>
    </nav>
  </header>
  <main id="stage-wrap"><div id="stage" aria-live="off"></div></main>
  <footer>
    <div id="caption" aria-live="polite"></div>
    <div id="controls">
      <button class="icon-btn" id="prev" type="button" title="上一步" aria-label="上一步">←</button>
      <button class="icon-btn" id="play" type="button" title="自动播放" aria-label="自动播放" aria-pressed="false">▶</button>
      <button class="icon-btn" id="next" type="button" title="下一步" aria-label="下一步">→</button>
      <select id="scene-select" aria-label="选择场景"></select>
      <div id="step-dots" aria-label="当前场景步骤"></div>
    </div>
    <div id="timeline" aria-label="全部场景"></div>
  </footer>
</div>
<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const XLINK = 'http://www.w3.org/1999/xlink';
const C = {
  node: '#38bdf8', entry: '#a3e635', exit: '#fbbf24', prov: '#818cf8', exe: '#34d399',
  talk: '#f472b6', warn: '#f59e0b', err: '#fb7185', mon: '#c084fc', line: '#64748b',
  text: '#f1f5f9', muted: '#94a3b8', panel: '#0f172a', group: '#111a2e'
};

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null && v !== '') e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function stepAttrs(o) {
  return { 'data-step': o.step ?? 0, 'data-until': o.until, 'data-hot': o.hot };
}
function text(parent, x, y, str, o = {}) {
  const lines = String(str).split('\n');
  const t = el('text', { x, y, 'font-size': o.size ?? 13, 'font-weight': o.weight ?? 400,
    'text-anchor': o.anchor ?? 'start', fill: o.fill ?? C.text, ...(o.attrs || {}) }, parent);
  lines.forEach((ln, i) => {
    const ts = el('tspan', { x, dy: i === 0 ? 0 : (o.lh ?? (o.size ?? 13) * 1.3) }, t);
    ts.textContent = ln;
  });
  return t;
}

function makeScene(svg, sceneIndex) {
  const boxes = {};
  const markers = new Set();
  const defs = el('defs', {}, svg);
  function marker(color, start) {
    const id = `s${sceneIndex}-m-` + (start ? 's' : 'e') + '-' + color.replace('#', '');
    if (!markers.has(id)) {
      markers.add(id);
      const m = el('marker', { id, viewBox: '0 0 10 10', refX: start ? 1 : 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: start ? 'auto-start-reverse' : 'auto' }, defs);
      el('path', { d: 'M0,0 L10,5 L0,10 z', fill: color }, m);
    }
    return `url(#${id})`;
  }

  function group(o) {
    const g = el('g', { class: 'step', ...stepAttrs(o) }, svg);
    el('rect', { x: o.x, y: o.y, width: o.w, height: o.h, rx: 16, fill: o.fill ?? C.group, stroke: o.color ?? '#1e293b', 'stroke-width': 1, 'stroke-dasharray': o.dashed ? '6 5' : null }, g);
    if (o.title) text(g, o.x + 14, o.y + 22, o.title, { size: 13, weight: 600, fill: o.color ?? C.muted });
    return g;
  }

  function box(o) {
    const g = el('g', { class: 'box step', id: o.id ? `s${sceneIndex}-b-` + o.id : null, style: `color:${o.color}`, ...stepAttrs(o) }, svg);
    el('rect', { x: o.x, y: o.y, width: o.w, height: o.h, rx: 12, fill: o.fill ?? C.panel, stroke: o.color, 'stroke-width': 1.6, 'stroke-dasharray': o.dashed ? '5 4' : null }, g);
    const subLines = o.sub ? String(o.sub).split('\n').length : 0;
    const titleSize = o.size ?? 15;
    const subSize = o.subSize ?? 11;
    const total = titleSize + (subLines ? 6 + subLines * subSize * 1.3 : 0);
    const top = o.y + o.h / 2 - total / 2;
    text(g, o.x + o.w / 2, top + titleSize * 0.85, o.title, { size: titleSize, weight: 600, anchor: 'middle', fill: C.text });
    if (o.sub) text(g, o.x + o.w / 2, top + titleSize + 6 + subSize, o.sub, { size: subSize, anchor: 'middle', fill: C.muted, lh: subSize * 1.3 });
    if (o.badge) {
      const bw = o.badge.length * 11 + 14;
      el('rect', { x: o.x + o.w - bw - 6, y: o.y - 10, width: bw, height: 18, rx: 9, fill: o.color }, g);
      text(g, o.x + o.w - bw / 2 - 6, o.y + 3, o.badge, { size: 10, weight: 700, anchor: 'middle', fill: '#0b1220' });
    }
    boxes[o.id] = o;
    return g;
  }

  function anchor(b, side, off = 0) {
    switch (side) {
      case 'left': return [b.x, b.y + b.h / 2 + off];
      case 'right': return [b.x + b.w, b.y + b.h / 2 + off];
      case 'top': return [b.x + b.w / 2 + off, b.y];
      default: return [b.x + b.w / 2 + off, b.y + b.h];
    }
  }
  const normal = { left: [-1, 0], right: [1, 0], top: [0, -1], bottom: [0, 1] };
  function bez(p, c1, c2, q, t) {
    const u = 1 - t;
    return [
      u * u * u * p[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * q[0],
      u * u * u * p[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * q[1]
    ];
  }
  function link(o) {
    const a = boxes[o.from], b = boxes[o.to];
    if (!a || !b) return null;
    const p = anchor(a, o.fs, o.offA || 0), q = anchor(b, o.ts, o.offB || 0);
    const d = Math.hypot(q[0] - p[0], q[1] - p[1]);
    const k = Math.max(o.minBend ?? 36, d * (o.bend ?? 0.4));
    const na = normal[o.fs], nb = normal[o.ts];
    const c1 = [p[0] + na[0] * k, p[1] + na[1] * k], c2 = [q[0] + nb[0] * k, q[1] + nb[1] * k];
    const path = `M${p[0]},${p[1]} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${q[0]},${q[1]}`;
    const mid = bez(p, c1, c2, q, o.labelT ?? 0.5);
    const color = o.color || C.line;
    const g = el('g', { class: 'link step', style: `color:${color}`, ...stepAttrs(o) }, svg);
    const cls = o.kind === 'session' ? 'session' : o.kind === 'plain' ? 'plain' : 'flow';
    el('path', { id: `s${sceneIndex}-p-` + o.id, d: path, fill: 'none', stroke: color, 'stroke-width': 1.8, class: cls,
      'marker-end': o.noArrow ? null : marker(color, false), 'marker-start': o.bidir ? marker(color, true) : null }, g);
    if (o.label) {
      const lines = o.label.split('\n');
      const w = Math.max(...lines.map(l => l.length)) * 6.6 + 12, h = 14 * lines.length + 6;
      const lx = mid[0] + (o.labelDx || 0), ly = mid[1] + (o.labelDy || 0);
      el('rect', { x: lx - w / 2, y: ly - h / 2, width: w, height: h, rx: 6, fill: '#0b1220', stroke: color, 'stroke-opacity': .35 }, g);
      text(g, lx, ly - h / 2 + 13, o.label, { size: 11, anchor: 'middle', fill: color, lh: 14 });
    }
    return g;
  }
  function packet(o) {
    const g = el('g', { class: 'packet step', style: `color:${o.color || C.exe}`, 'data-step': o.step, 'data-until': o.until ?? o.step }, svg);
    el('circle', { r: o.r || 6, fill: o.color || C.exe }, g);
    if (o.label) text(g, 0, -11, o.label, { size: 11, weight: 600, anchor: 'middle', fill: o.color || C.exe });
    const am = el('animateMotion', { dur: (o.dur || 1.8) + 's', repeatCount: 'indefinite', begin: (o.delay || 0) + 's' }, g);
    const mp = el('mpath', {}, am);
    mp.setAttribute('href', `#s${sceneIndex}-p-` + o.path);
    mp.setAttributeNS(XLINK, 'xlink:href', `#s${sceneIndex}-p-` + o.path);
    return g;
  }
  function note(o) {
    const lines = String(o.lines).split('\n');
    const size = o.size ?? 12.5, lh = size * 1.45;
    const h = o.h ?? lines.length * lh + 18;
    const g = el('g', { class: 'step', ...stepAttrs(o) }, svg);
    el('rect', { x: o.x, y: o.y, width: o.w, height: h, rx: 10, fill: '#0b1220', stroke: o.color ?? C.warn, 'stroke-width': 1.2, 'stroke-opacity': .7 }, g);
    if (o.title) text(g, o.x + 12, o.y + 17, o.title, { size: 11, weight: 700, fill: o.color ?? C.warn });
    text(g, o.x + 12, o.y + (o.title ? 34 : 14 + size * 0.8), o.lines, { size, fill: C.text, lh });
    return g;
  }
  function bubble(o) {
    const g = el('g', { class: 'step', ...stepAttrs(o) }, svg);
    const w = o.w ?? o.text.length * 15 + 26, h = 36;
    el('rect', { x: o.x, y: o.y, width: w, height: h, rx: 18, fill: o.color ?? C.entry }, g);
    el('path', { d: `M${o.x + 20},${o.y + h} l6,10 l6,-10 z`, fill: o.color ?? C.entry }, g);
    text(g, o.x + w / 2, o.y + 23, o.text, { size: 14, weight: 600, anchor: 'middle', fill: '#0b1220' });
    return g;
  }
  function heading(x, y, str, o = {}) {
    return text(svg, x, y, str, { size: o.size ?? 15, weight: 600, fill: o.fill ?? C.muted, anchor: o.anchor });
  }
  return { svg, boxes, group, box, link, packet, note, bubble, heading };
}


const scenes = [];
scenes.push({
  project: 'overview', title: '两个项目 · 一份介绍',
  captions: ['两套独立系统：Welcome 将现场感知转成播报与机器人动作；加工监控与反控将设备数据转成过程判定与机床控制。'],
  build(s) {
    text(s.svg, 70, 90, '项目架构介绍', { size: 39, weight: 700, fill: C.text });
    text(s.svg, 70, 135, '两条独立主线', { size: 18, fill: C.muted });
    el('path', { d: 'M70 189 H1210', stroke: '#344346', 'stroke-width': 1 }, s.svg);
    text(s.svg, 70, 252, '01', { size: 21, weight: 700, fill: '#80d5b6' });
    text(s.svg, 140, 252, 'Welcome 迎宾机器人', { size: 33, weight: 700, fill: C.text });
    text(s.svg, 140, 298, '感知 → 决策 → 表达 / 动作', { size: 21, fill: '#80d5b6' });
    el('path', { d: 'M70 359 H1210', stroke: '#344346', 'stroke-width': 1 }, s.svg);
    text(s.svg, 70, 422, '02', { size: 21, weight: 700, fill: '#f1b67a' });
    text(s.svg, 140, 422, '加工监控与反控', { size: 33, weight: 700, fill: C.text });
    text(s.svg, 140, 468, '采集 → 组帧 → 对齐 → 判定 → 反控', { size: 21, fill: '#f1b67a' });
    el('path', { d: 'M70 530 H1210', stroke: '#344346', 'stroke-width': 1 }, s.svg);
  }
});
// 1 Welcome 迎宾机器人开场
scenes.push({
  project: 'welcome',
  title: '开场',
  captions: [
    '这是 Welcome 迎宾机器人项目：通过语音、视觉和动作协同，把现场感知转成自然的播报与机器人动作。'
  ],
  build(s) {
    text(s.svg, 640, 250, '迎宾机器人', { size: 76, weight: 700, anchor: 'middle', fill: C.text });
    text(s.svg, 640, 304, '感知 → 决策 → 表达 / 动作', { size: 26, anchor: 'middle', fill: C.muted });
  }
});
// 2 主干
scenes.push({
  title: '主干',
  captions: [
    '导航图有两条链：上链表达，下链动作。现场输入进 asr 与 vlm，executor 决策，talker 说话，tts 播报。',
    '同一份决策经 mcp 下发：x1_pro_actions 提供 MCP 工具，x1_core 是 REST 网关，最后驱动真机。',
    '回执原路返回形成闭环；planner 只是 executor 打开的会话。provider 全部由 adapters 在装配期注入。'
  ],
  build(s) {
    s.box({ id: 'input', x: 40, y: 110, w: 150, h: 100, title: '现场', sub: '麦克风 · 相机', color: C.entry, step: 0, hot: '0' });
    s.box({ id: 'asr', x: 240, y: 70, w: 140, h: 64, title: 'asr', sub: '语音识别', color: C.node, step: 0, hot: '0' });
    s.box({ id: 'vlm', x: 240, y: 158, w: 140, h: 64, title: 'vlm', sub: '视觉理解', color: C.node, step: 0, hot: '0' });
    s.box({ id: 'exe', x: 430, y: 105, w: 170, h: 110, title: 'executor', sub: '决策与执行', color: C.exe, step: 0, hot: '0', badge: '核心 A' });
    s.box({ id: 'tk', x: 650, y: 105, w: 160, h: 110, title: 'talker', sub: '话术生成', color: C.talk, step: 0, hot: '0', badge: '核心 B' });
    s.box({ id: 'tts', x: 860, y: 125, w: 150, h: 80, title: 'tts', sub: '语音合成', color: C.node, step: 0, hot: '0' });
    s.box({ id: 'termOut', x: 1060, y: 125, w: 160, h: 80, title: '终端下行', sub: '播报', color: C.exit, step: 0, hot: '0' });

    s.box({ id: 'pl', x: 650, y: 270, w: 150, h: 70, title: 'planner', sub: '会话式规划 · 孤岛', color: C.warn, step: 2, dashed: true, hot: '2' });
    s.box({ id: 'mcp', x: 430, y: 410, w: 150, h: 80, title: 'mcp', sub: '动作库 + 反馈', color: C.node, step: 1, hot: '1' });
    s.box({ id: 'act', x: 630, y: 410, w: 180, h: 80, title: 'x1_pro_actions', sub: 'MCP server · 动作编排', color: C.exit, step: 1, hot: '1' });
    s.box({ id: 'gw', x: 860, y: 410, w: 150, h: 80, title: 'x1_core 网关', sub: 'REST /api/v1', color: C.exit, step: 1, hot: '1' });
    s.box({ id: 'hw', x: 1060, y: 410, w: 160, h: 80, title: '真机', sub: '机械臂 · 底盘', color: C.err, step: 1, hot: '1' });
    s.box({ id: 'sim', x: 860, y: 545, w: 180, h: 50, title: '共享仿真', sub: '可切换替身', color: C.exit, step: 2, dashed: true, hot: '2' });
    s.note({ x: 40, y: 545, w: 360, h: 50, lines: 'provider 直连：LLM ×3 · 火山 ASR · 火山 TTS\n由 adapters 在装配期注入', step: 2, color: C.prov, size: 12 });

    s.link({ id: 'i2a', from: 'input', to: 'asr', fs: 'right', ts: 'left', step: 0, hot: '0', color: C.entry, offA: -25, minBend: 24 });
    s.link({ id: 'i2v', from: 'input', to: 'vlm', fs: 'right', ts: 'left', step: 0, hot: '0', color: C.entry, offA: 25, minBend: 24 });
    s.link({ id: 'a2e', from: 'asr', to: 'exe', fs: 'right', ts: 'left', step: 0, hot: '0', color: C.node, offB: -28, minBend: 20 });
    s.link({ id: 'v2e', from: 'vlm', to: 'exe', fs: 'right', ts: 'left', step: 0, hot: '0', color: C.node, offB: 28, minBend: 20 });

    s.box({ id: 'w', x: 360, y: 470, w: 200, h: 90, title: '参数写库', sub: '唯一事实来源', color: C.exe, step: 1, hot: '1' });
    s.box({ id: 'r', x: 650, y: 470, w: 200, h: 90, title: '运行任务生效', sub: '版本对账', color: C.node, step: 1, hot: '1' });
    s.link({ id: 'p4', from: 'w', to: 'r', fs: 'right', ts: 'left', label: '变更事件', step: 1, hot: '1', color: C.mon, minBend: 24 });
    s.packet({ path: 'p4', step: 1, until: 1, color: C.mon, dur: 1.2 });
  }
});

// 5 收尾
scenes.push({
  title: '收尾',
  captions: [
    '一句话：接入统一、时间轴统一、对齐赋予语义、业务并行判定、执行收口反控。平台负责存储、参数与观测。'
  ],
  build(s) {
    text(s.svg, 640, 190, '加工监控与反控 · 主线', { size: 36, weight: 700, anchor: 'middle', fill: C.text });
    const cols = [
      ['接入', C.node], ['组帧', C.node], ['对齐', C.exe], ['判定', C.talk], ['反控', C.exit]
    ];
    cols.forEach(([t, c], i) => {
      const x = 90 + i * 220;
      const g = el('g', { class: 'step', 'data-step': 0 }, s.svg);
      el('rect', { x, y: 280, width: 180, height: 90, rx: 14, fill: C.panel, stroke: c, 'stroke-width': 1.6 }, g);
      text(g, x + 90, 336, t, { size: 24, weight: 700, anchor: 'middle', fill: c });
      if (i < cols.length - 1) {
        el('path', { d: `M${x + 186},325 h28`, stroke: '#334155', 'stroke-width': 2, fill: 'none' }, g);
      }
    });
    text(s.svg, 640, 470, '平台：双存储分工 · 参数热更新 · 观测旁路', { size: 18, anchor: 'middle', fill: C.muted });
  }
});


scenes.forEach((scene, index) => {
  if (!scene.project) scene.project = index < machiningStart ? 'welcome' : 'machining';
  scene.title = ({ '主干': '系统主干', 'crate 分层': '工程分层', '开场': '项目概览', '收尾': '项目回顾' })[scene.title] || scene.title;
});

const stage = document.getElementById('stage');
const titleEl = document.getElementById('title');
const counterEl = document.getElementById('counter');
const captionEl = document.getElementById('caption');
const selectEl = document.getElementById('scene-select');
const stepDots = document.getElementById('step-dots');
const timeline = document.getElementById('timeline');
const playEl = document.getElementById('play');
const prevEl = document.getElementById('prev');
const nextEl = document.getElementById('next');
const projectButtons = [...document.querySelectorAll('#projects button')];
const projectNames = { overview: '总览', welcome: 'Welcome 迎宾机器人', machining: '加工监控与反控' };
const projectColors = { overview: '#d6e1db', welcome: '#80d5b6', machining: '#f1b67a' };
const svgs = scenes.map((scene, i) => {
  const svg = el('svg', { viewBox: '0 0 1280 640', class: 'scene', role: 'img', 'aria-label': projectNames[scene.project] + '：' + scene.title }, stage);
  scene.build(makeScene(svg, i));
  svg.setAttribute('aria-hidden', 'true');
  return svg;
});
let current = 0, step = 0, timer = null;
const params = new URLSearchParams(location.search);
const requestedDelay = Number(params.get('dt'));
const autoMs = requestedDelay > 0 ? Math.max(1000, requestedDelay * 1000) : 7000;

for (const project of ['overview', 'welcome', 'machining']) {
  const group = document.createElement('optgroup');
  group.label = projectNames[project];
  scenes.forEach((scene, i) => {
    if (scene.project !== project) return;
    const option = document.createElement('option');
    option.value = i;
    option.textContent = scene.title;
    group.appendChild(option);
  });
  selectEl.appendChild(group);
}
scenes.forEach((scene, i) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.dataset.project = scene.project;
  button.title = projectNames[scene.project] + ' · ' + scene.title;
  button.setAttribute('aria-label', button.title);
  button.addEventListener('click', () => go(i, 0));
  timeline.appendChild(button);
});

function render() {
  const scene = scenes[current];
  document.documentElement.style.setProperty('--accent', projectColors[scene.project]);
  svgs.forEach((svg, i) => {
    svg.classList.toggle('active', i === current);
    svg.setAttribute('aria-hidden', String(i !== current));
  });
  svgs[current].querySelectorAll('[data-step]').forEach(node => {
    const from = Number(node.dataset.step || 0);
    const until = node.dataset.until === undefined ? Infinity : Number(node.dataset.until);
    const on = step >= from && step <= until;
    node.classList.toggle('on', on);
    node.classList.toggle('hot', on && (node.dataset.hot || '').split(' ').includes(String(step)));
  });
  titleEl.textContent = scene.project === 'overview' ? scene.title : projectNames[scene.project] + ' · ' + scene.title;
  counterEl.textContent = (current + 1) + ' / ' + scenes.length + ' · ' + (step + 1) + ' / ' + scene.captions.length;
  captionEl.textContent = scene.captions[step];
  selectEl.value = String(current);
  projectButtons.forEach(button => button.setAttribute('aria-current', String(button.dataset.project === scene.project)));
  [...timeline.children].forEach((button, i) => button.setAttribute('aria-current', i === current ? 'page' : 'false'));
  stepDots.replaceChildren();
  scene.captions.forEach((_, i) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.title = '第 ' + (i + 1) + ' 步';
    button.setAttribute('aria-label', button.title);
    button.setAttribute('aria-current', i === step ? 'step' : 'false');
    button.addEventListener('click', () => go(current, i));
    stepDots.appendChild(button);
  });
  prevEl.disabled = current === 0 && step === 0;
  nextEl.disabled = current === scenes.length - 1 && step === scene.captions.length - 1;
  if (nextEl.disabled && timer) stopAuto();
  const hash = '#' + (current + 1) + '.' + (step + 1);
  if (location.hash !== hash) location.hash = hash;
}
function go(scene, nextStep) {
  current = Math.max(0, Math.min(scenes.length - 1, scene));
  step = Math.max(0, Math.min(scenes[current].captions.length - 1, nextStep));
  render();
}
function next() {
  if (step < scenes[current].captions.length - 1) go(current, step + 1);
  else if (current < scenes.length - 1) go(current + 1, 0);
  else stopAuto();
}
function prev() {
  if (step > 0) go(current, step - 1);
  else if (current > 0) go(current - 1, scenes[current - 1].captions.length - 1);
}
function stopAuto() {
  if (timer) clearInterval(timer);
  timer = null;
  playEl.textContent = '▶';
  playEl.title = playEl.ariaLabel = '自动播放';
  playEl.setAttribute('aria-pressed', 'false');
}
function startAuto() {
  if (nextEl.disabled) go(0, 0);
  timer = setInterval(next, autoMs);
  playEl.textContent = 'Ⅱ';
  playEl.title = playEl.ariaLabel = '暂停播放';
  playEl.setAttribute('aria-pressed', 'true');
}
function fromHash() {
  const match = location.hash.match(/^#(\d+)\.(\d+)$/);
  go(match ? Number(match[1]) - 1 : 0, match ? Number(match[2]) - 1 : 0);
}
projectButtons.forEach(button => button.addEventListener('click', () => go(scenes.findIndex(scene => scene.project === button.dataset.project), 0)));
selectEl.addEventListener('change', () => go(Number(selectEl.value), 0));
prevEl.addEventListener('click', prev);
nextEl.addEventListener('click', next);
playEl.addEventListener('click', () => timer ? stopAuto() : startAuto());
stage.addEventListener('click', event => {
  if (event.clientX < stage.getBoundingClientRect().left + stage.clientWidth * .2) prev();
  else next();
});
document.addEventListener('keydown', event => {
  if (event.metaKey || event.ctrlKey || event.altKey || /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if (event.key === ' ' && document.activeElement.tagName === 'BUTTON') return;
  switch (event.key) {
    case 'ArrowRight': case ' ': case 'PageDown': event.preventDefault(); next(); break;
    case 'ArrowLeft': case 'PageUp': event.preventDefault(); prev(); break;
    case 'Home': event.preventDefault(); go(0, 0); break;
    case 'End': event.preventDefault(); go(scenes.length - 1, 0); break;
    case 'a': case 'A': timer ? stopAuto() : startAuto(); break;
    case 'f': case 'F': document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); break;
    default:
      if (/^[0-9]$/.test(event.key)) go(event.key === '0' ? 9 : Number(event.key) - 1, 0);
  }
});
addEventListener('hashchange', fromHash);
fromHash();
if (params.get('auto') === '1') startAuto();
})();
</script>
</body>
